[settings]
# extends task-inheritance is mise experimental — joeblew999/.github
# v0.18+ uses it for per-namespace tools dedup (cf:_base, bw:_base, etc).
experimental = true

# agentic-inbox fork — operator deploy tooling.
#
# Layered on top of upstream cloudflare/agentic-inbox. Heavy lifting lives
# in the shared joeblew999/.github/mise-tasks library imported below.
#
# Deploy lifecycle (one time):
#   1. cp config/template.env config/production.env  # fill identity values
#   2. fnox set --provider keychain CLOUDFLARE_API_TOKEN  # one-time per machine
#      fnox set --provider keychain CLOUDFLARE_ACCOUNT_ID
#   3. mise run cf:provision-d1-r2     # creates R2 only (D1 not used here)
#   4. mise run cf:access-setup        # creates Access App + writes fnox values
#   5. mise run cf:secrets-put-mapped  # fnox -> Worker secrets (POLICY_AUD, TEAM_DOMAIN)
#   6. mise run 10-deploy
#   7. (manual) Configure Email Routing rule in dashboard

[task_config]
# Migrated to v0.17.3 TOML-task includes (joeblew999/.github). Per-task
# tools come along with each task; consumer no longer pins gh+jq+envsubst
# just because shared tasks use them. envsubst dropped entirely —
# wrangler:gen is now pure nu (no shell substitution).
#
# Browseable (clicking the `git::` URL will 404):
#   https://github.com/joeblew999/.github/blob/v0.18.0/tasks/cf.toml
#   https://github.com/joeblew999/.github/blob/v0.18.0/tasks/env.toml
#   https://github.com/joeblew999/.github/blob/v0.18.0/tasks/prove.toml
#   https://github.com/joeblew999/.github/blob/v0.18.0/tasks/wrangler.toml
#   https://github.com/joeblew999/.github/blob/v0.18.0/tasks/secrets.toml
includes = [
  "git::https://github.com/joeblew999/.github.git//tasks/ci.toml?ref=v0.18.0",
  "git::https://github.com/joeblew999/.github.git//tasks/cf.toml?ref=v0.18.0",
  "git::https://github.com/joeblew999/.github.git//tasks/env.toml?ref=v0.18.0",
  "git::https://github.com/joeblew999/.github.git//tasks/prove.toml?ref=v0.18.0",
  "git::https://github.com/joeblew999/.github.git//tasks/wrangler.toml?ref=v0.18.0",
  "git::https://github.com/joeblew999/.github.git//tasks/secrets.toml?ref=v0.18.0",
]

[tools]
# Consumer's own tools — pinned because agentic-inbox's local tasks
# (1-install, 6-build, 10-deploy, dev) call them directly.
node                     = "24"
"npm:wrangler"           = "4.84.1"
"github:jdx/fnox"        = "1.24"
"github:nushell/nushell" = "0.112"
"cargo:usage-cli"        = "3"
# Shared-lib tasks (ci/cf/env/prove/wrangler/secrets) bring their own
# gh/jq via per-task `tools = { ... }` — no longer pinned here.

[env]
DEFAULT_ENV    = "production"
FNOX_SYNC_KEYS = ""

# ── Per-fork inline tasks (everything else comes from shared) ────────────────

[tasks."env:dump"]
description = "Print all keys + values from config/<env>.env (default: production)."
run = '''
file=$(mise run -q env:resolve)
echo "# $file"
cat "$file"
'''

[tasks."env:list"]
description = "List every env config (config/<name>.env)."
run         = "ls -1 config/*.env 2>/dev/null | grep -v template.env || echo 'no env files yet — copy config/template.env'"

[tasks."1-install"]
description = "Install npm deps (first time)."
run         = "npm install"

[tasks."6-build"]
description = "Build the React Router SPA + worker bundle — required before deploy."
depends     = ["1-install", "wrangler:gen"]
run         = "npm run build"

[tasks."10-deploy"]
description = "Build + deploy the Worker. Validates CF token first."
depends     = ["cf:token-check", "6-build"]
run         = "wrangler deploy"

[tasks."10b-redeploy"]
description = "Re-deploy without rebuilding (fast iteration after wrangler.toml/secret changes)."
depends     = ["wrangler:gen"]
run         = "wrangler deploy"

[tasks."dev"]
description = "Run agentic-inbox locally (Vite + wrangler dev)."
depends     = ["wrangler:gen"]
run         = "npm run dev"

[tasks."prove:all"]
description = "Run all prove:* checks (deployed + bindings + access-policy + secrets)."
depends     = ["prove:deployed", "prove:bindings", "prove:access-policy", "prove:secrets"]

# ── check ────────────────────────────────────────────────────────────────────
# Local lint canary — run before every push.
#   ci:parse-check           parse-checks any nu files in mise-tasks/
#   ci:check-toml-tasks      parse-checks inline run bodies in tasks/*.toml
#   ci:check-workflow-nu     parse-checks embedded nu blocks in .github/workflows/*.yml
# All three are no-ops in repos lacking those files. Adds <2s
# overhead, catches nu syntax errors locally instead of in CI.
[tasks.check]
description = "Local lint: parse-check every nu file + TOML-task body + workflow nu block"
depends = ["ci:parse-check", "ci:check-toml-tasks", "ci:check-workflow-nu"]
run = "echo \"✓ check passed\""
